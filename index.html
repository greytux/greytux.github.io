<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>🐶Turrobuses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005bb7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Turrobuses" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Leaflet (mapa) -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="" defer></script>

    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="title-block">
            <div>
                <h1>🐶Turrobuses</h1>
            </div>
        </div>
        <div class="refresh-block">
            <button class="refresh-btn" id="refresh-now"
                    type="button"
                    aria-label="Refrescar paradas"
                    title="Refrescar">
                <span class="icon" aria-hidden="true">⟳</span>
            </button>
            <div class="last-update-global" id="last-update-global" aria-live="polite">
                Última actualización: —
            </div>
        </div>
    </header>

    <section class="legend">
        <div class="legend-item">
            <div class="legend-color red"></div>
            <span>Arreando</span>
        </div>
        <div class="legend-item">
            <div class="legend-color green"></div>
            <span>Con tiempo</span>
        </div>
    </section>

    <main class="main">
        <div class="tabs">
            <button class="tab-btn active" data-index="0">Favoritas</button>
            <button class="tab-btn" data-index="1">Cerca de mí</button>
            <button class="tab-btn" data-index="2">Mapa</button>
        </div>

        <div class="slider">
            <div class="slides" id="slides">
                <!-- Slide 0: Favoritas -->
                <section class="slide accordion" data-slide="0">
                    <div id="shortcuts-config"></div>

                    <section class="dynamic-controls">
                        <div class="dynamic-title">Añadir parada favorita</div>
                        <form id="add-favorite-form" class="dynamic-form">
                            <label for="fav-id-input">Parada</label>
                            <input
                                    id="fav-id-input"
                                    class="dynamic-input"
                                    type="number"
                                    inputmode="numeric"
                                    placeholder="Ej: 3224"
                            />
                            <input
                                    id="fav-lines-input"
                                    class="dynamic-input"
                                    type="text"
                                    placeholder="Líneas (ej: 66,137) — opcional"
                            />
                            <button type="submit" class="dynamic-button">Añadir</button>
                        </form>
                        <button type="button" id="scan-qr-btn" class="scan-qr-btn">
                            📷 Escanear QR de la parada
                        </button>
                        <div class="dynamic-help">
                            Tus favoritas se guardan en este navegador. Puedes añadir, quitar o reordenar paradas.
                        </div>
                    </section>

                    <div class="nearby-filter">
                        <label for="fav-line-input">Filtrar favoritas por línea (opcional)</label>
                        <input
                                id="fav-line-input"
                                class="nearby-line-input"
                                type="text"
                                inputmode="numeric"
                                placeholder="Ej: 137"
                        />
                        <div id="fav-filter-message" class="nearby-filter-message"></div>
                    </div>

                    <div id="favorites-stops"></div>
                </section>

                <!-- Slide 1: Paradas cercanas -->
                <section class="slide accordion" data-slide="1">
                    <section class="nearby-section">
                        <div class="nearby-title">
                            Paradas cercanas
                            <span class="nearby-badge">Top 10</span>
                        </div>
                        <div class="nearby-status" id="nearby-status">
                            Usa el botón de refrescar para buscar paradas cerca de ti.
                        </div>

                        <div class="nearby-filter">
                            <label for="nearby-line-input">Filtrar paradas cercanas por línea (opcional)</label>
                            <input
                                    id="nearby-line-input"
                                    class="nearby-line-input"
                                    type="text"
                                    inputmode="numeric"
                                    placeholder="Ej: 137"
                            />
                            <button type="button" id="nearby-clear" class="nearby-filter-clear">
                                Quitar filtro
                            </button>
                            <div id="nearby-filter-message" class="nearby-filter-message"></div>
                        </div>

                        <div id="nearby-accordion"></div>
                    </section>
                </section>

                <!-- Slide 2: Mapa -->
                <section class="slide" data-slide="2">
                    <div class="map-wrapper">
                        <div id="map" aria-label="Mapa de paradas"></div>
                        <div class="map-legend" aria-hidden="true">
                            <span class="map-legend-item"><span class="map-legend-dot map-legend-fav">★</span>Favorita</span>
                            <span class="map-legend-item"><span class="map-legend-dot map-legend-near"></span>Cercana</span>
                            <span class="map-legend-item"><span class="map-legend-dot map-legend-user"></span>Tú</span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<!-- Nuevo: script modular -->
<script type="module" src="./js/main.js"></script>
</body>
</html>
